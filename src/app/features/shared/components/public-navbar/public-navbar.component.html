<nav class="nav nav--fixed">
  <div class="container nav__container">
    <a routerLink="/" class="nav__brand">
      <div class="logo-glow">
        <img src="/assets/images/logo.png" alt="Club TDSI" class="nav__logo" />
      </div>
      <span class="nav__name">Club <span>TDSI · Campus</span></span>
    </a>

    <div class="nav__links">
      <a routerLink="/thematiques" routerLinkActive="active" class="nav__link">
        <span class="link-dot"></span>
        <i class="fas fa-layer-group"></i>
        Thématiques
      </a>
      <a routerLink="/workshops" routerLinkActive="active" class="nav__link">
        <span class="link-dot"></span>
        <i class="fas fa-chalkboard-user"></i>
        Workshops
      </a>
      <a routerLink="/activites" routerLinkActive="active" class="nav-link">
        Événements
      </a>
    </div>

    <div class="nav__actions">
      @if (!isLoggedIn()) {
        <a routerLink="/connexion" class="btn btn--ghost">
          <i class="fas fa-key"></i>
          Connexion
        </a>
        <a routerLink="/inscription" class="btn btn--primary">
          <span class="btn-glow"></span>
          <i class="fas fa-user-plus"></i>
          Rejoindre
          <i class="fas fa-arrow-right"></i>
        </a>
      } @else {
        <div class="user-menu">
          <button class="user-menu__trigger" (click)="toggleUserMenu()">
            <div class="user-avatar">{{ userInitial }}</div>
            <span class="user-name">{{ user?.displayName }}</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          @if (userMenuOpen()) {
            <div class="user-menu__dropdown">
              <a routerLink="/espace-membre" class="user-menu__item">
                <i class="fas fa-user-circle"></i>
                Mon espace
              </a>
              <button class="user-menu__logout" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Déconnexion
              </button>
            </div>
          }
        </div>
      }
    </div>
  </div>
</nav>
