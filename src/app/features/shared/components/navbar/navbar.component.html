<nav class="navbar">
  <div class="container navbar__container">
    <a routerLink="/" class="navbar__brand">
      <img src="/assets/images/logo.png" alt="TDSI" />
      <span>Club TDSI</span>
    </a>

    <div class="navbar__links">
      <a routerLink="/thematiques" routerLinkActive="active">Thématiques</a>
      <a routerLink="/workshops" routerLinkActive="active">Workshops</a>

      @if (isLoggedIn()) {
        <div class="user-menu">
          <button class="user-menu__btn">
            {{ userInitial }}
          </button>
          <div class="user-menu__dropdown">
            <a routerLink="/espace-membre">Mon espace</a>
            <a routerLink="/espace-membre/profil">Mon profil</a>
            <button (click)="logout()">Déconnexion</button>
          </div>
        </div>
      } @else {
        <a routerLink="/connexion" class="btn btn--outline btn--sm"
          >Connexion</a
        >
        <a routerLink="/inscription" class="btn btn--primary btn--sm"
          >Inscription</a
        >
      }
    </div>
  </div>
</nav>
