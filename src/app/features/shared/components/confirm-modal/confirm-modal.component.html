<!-- confirm-modal.component.html -->
@if (confirmService.config(); as config) {
  <div class="modal-overlay" (click)="confirmService.cancel()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <!-- Animated gradient border -->
      <div class="modal-gradient-border"></div>

      <div class="modal-header">
        <div class="modal-icon" [class]="'modal-icon--' + config.type">
          @switch (config.type) {
            @case ('danger') {
              <div class="icon-wrapper">
                <i class="fas fa-exclamation-triangle"></i>
                <div class="icon-pulse"></div>
              </div>
            }
            @case ('warning') {
              <div class="icon-wrapper">
                <i class="fas fa-shield-alt"></i>
                <div class="icon-pulse"></div>
              </div>
            }
            @default {
              <div class="icon-wrapper">
                <i class="fas fa-info-circle"></i>
                <div class="icon-pulse"></div>
              </div>
            }
          }
        </div>
        <button class="modal-close" (click)="onCancel()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <h3 class="modal-title">{{ config.title }}</h3>
        <p class="modal-message">{{ config.message }}</p>
      </div>

      <div class="modal-footer">
        <button class="modal-btn modal-btn--cancel" (click)="onCancel()">
          <i class="fas fa-times"></i>
          <span>{{ config.cancelText || 'Annuler' }}</span>
        </button>
        <button class="modal-btn" [class]="'modal-btn--' + config.type" (click)="onConfirm()">
          <i class="fas" [class.fa-trash-alt]="config.type === 'danger'"
                       [class.fa-exclamation]="config.type === 'warning'"
                       [class.fa-check]="config.type !== 'danger' && config.type !== 'warning'"></i>
          <span>{{ config.confirmText || 'Confirmer' }}</span>
        </button>
      </div>
    </div>
  </div>
}
