<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="'toast--' + toast.type" [class.toast--exiting]="exiting.has(toast.id)">
      <div class="toast__icon">
        @switch (toast.type) {
          @case ('success') {
            <i class="fas fa-check"></i>
          }
          @case ('error') {
            <i class="fas fa-exclamation-circle"></i>
          }
          @case ('warning') {
            <i class="fas fa-exclamation-triangle"></i>
          }
          @default {
            <i class="fas fa-info-circle"></i>
          }
        }
      </div>
      <div class="toast__content">
        <p class="toast__message">{{ toast.message }}</p>
      </div>
      <button class="toast__close" (click)="removeToast(toast.id)">
        <i class="fas fa-times"></i>
      </button>
      @if (toast.duration && toast.duration > 0) {
        <div class="toast__progress">
          <div class="toast__progress-bar" [style.animation-duration.ms]="toast.duration"></div>
        </div>
      }
    </div>
  }
</div>
