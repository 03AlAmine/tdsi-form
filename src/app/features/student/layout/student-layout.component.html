<div class="student-layout">
  <!-- Tech Background (comme sur les pages publiques) -->
  <app-tech-background />
  <!-- Navigation (version membre) -->
  <header class="topbar">
    <div class="container topbar__container">
      <a routerLink="/espace-membre" class="topbar__brand">
        <img
          src="/assets/images/logo.png"
          alt="TDSI Club"
          class="topbar__logo"
        />
        <span class="topbar__name">Club <span>TDSI </span>Campus</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav">
        <a
          routerLink="/espace-membre/thematiques"
          routerLinkActive="active"
          class="desktop-nav__item"
        >
          <i class="fas fa-layer-group"></i>
          Thématiques
        </a>
        <a
          routerLink="/espace-membre/workshops"
          routerLinkActive="active"
          class="desktop-nav__item"
        >
          <i class="fas fa-chalkboard-user"></i>
          Workshops
        </a>
        <a
          routerLink="/espace-membre/proposer"
          routerLinkActive="active"
          class="desktop-nav__item"
        >
          <i class="fas fa-lightbulb"></i>
          Proposer
        </a>
        <a
          routerLink="/espace-membre/mes-soumissions"
          routerLinkActive="active"
          class="desktop-nav__item"
        >
          <i class="fas fa-file-alt"></i>
          Mes dépôts
        </a>
        <a
          routerLink="/espace-membre/activites"
          routerLinkActive="active"
          class="desktop-nav__item"
        >
          <i class="fas fa-calendar-star"></i>
          Activités
        </a>
      </nav>

      <div class="topbar__user">
        <div class="user-menu">
          <button class="user-menu__trigger" (click)="toggleUserMenu()">
            <div class="user-avatar">
              <span>{{ initial }}</span>
            </div>
            <span class="user-name">{{ user?.displayName }}</span>
            <i class="fas fa-chevron-down"></i>
          </button>

          @if (userMenuOpen()) {
            <div class="user-menu__dropdown">
              <div class="user-menu__info">
                <div class="user-menu__avatar">{{ initial }}</div>
                <div>
                  <div class="user-menu__name">{{ user?.displayName }}</div>
                  <div class="user-menu__email">{{ user?.email }}</div>
                  <div class="user-menu__promo">{{ user?.promo }}</div>
                </div>
              </div>
              <div class="user-menu__divider"></div>

              <a
                routerLink="/espace-membre/profil"
                class="user-menu__item"
                (click)="userMenuOpen.set(false)"
              >
                <i class="fas fa-user-circle"></i>
                Mon profil
              </a>

              <button class="user-menu__logout" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Déconnexion
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-transition">
      <router-outlet />
    </div>
  </main>

  <!-- Footer (réutilisé)
  <app-public-footer /> -->
</div>
