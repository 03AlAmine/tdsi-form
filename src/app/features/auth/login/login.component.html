<div class="login-page">
    <app-tech-background />

  <!-- Tech Background -->
  <div class="login-page__bg">
    <div class="login-page__grid"></div>
    <div class="login-page__gradient"></div>
  </div>

  <div class="login-card">
    <a routerLink="/" class="login-card__back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Retour
    </a>

    <div class="login-card__header">
      <app-logo size="md"></app-logo>
      <h1 class="login-card__title">Connexion</h1>
      <p class="login-card__subtitle">Accède à ton espace TDSI</p>
    </div>

    @if (error()) {
      <div class="alert alert--error animate-fade-in" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label form-label--required">
          Email institutionnel
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          [class.form-input--error]="isInvalid('email')"
          placeholder="prenom.nom@esp.sn"
          autocomplete="email"
        />
        @if (isInvalid('email')) {
          <span class="form-error">
            Veuillez entrer un email valide
          </span>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label form-label--required">
          Mot de passe
        </label>
        <div class="password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            class="form-input password-input__field"
            [class.form-input--error]="isInvalid('password')"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePassword()"
            aria-label="Afficher/masquer le mot de passe"
          >
            @if (!showPassword()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
        @if (isInvalid('password')) {
          <span class="form-error">
            Mot de passe requis (min. 6 caractères)
          </span>
        }
      </div>

      <button
        type="submit"
        class="btn btn--primary btn--full btn--lg"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          Connexion...
        } @else {
          Connexion
        }
      </button>
    </form>

    <div class="login-card__divider"></div>

    <p class="login-card__footer">
      Pas encore membre ?
      <a routerLink="/inscription" class="login-card__link">
        Créer un compte
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </p>
  </div>
</div>
