<div class="admin-layout">
  <!-- Sidebar Desktop -->
  <aside class="sidebar" [class.sidebar--collapsed]="false">
    <div class="sidebar__header">
      <a routerLink="/admin/dashboard" class="sidebar__brand">
        <div class="sidebar__logo">
          <img src="/assets/images/logo.png" alt="Club TDSI" />
        </div>
        <div class="sidebar__brand-text">TDSI <span>Club</span></div>
      </a>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="sidebar__item"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <svg
            class="sidebar__item-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path [attr.d]="item.icon" />
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">
          <span>👨‍💼</span>
        </div>
        <div class="sidebar__user-info">
          <div class="sidebar__user-name">Administrateur</div>
          <div class="sidebar__user-role">TDSI Admin</div>
        </div>
      </div>
      <button class="sidebar__logout" (click)="logout()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Mobile Top Bar -->
  <header class="mobile-header">
    <div class="mobile-header__container">
      <button class="mobile-header__menu-btn" (click)="mobileOpen.set(true)">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <a routerLink="/admin/dashboard" class="mobile-header__brand">
        <img src="/assets/images/logo.png" alt="Club TDSI" />
        <span>TDSI <span>Club</span></span>
      </a>

      <button class="mobile-header__logout" (click)="logout()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  @if (mobileOpen()) {
    <div class="mobile-menu" (click)="closeMobileMenu()">
      <div class="mobile-menu__container" (click)="$event.stopPropagation()">
        <div class="mobile-menu__header">
          <div class="mobile-menu__brand">
            <img src="/assets/images/logo.png" alt="Club TDSI" />
            <span>TDSI <span>Club</span></span>
          </div>
          <button class="mobile-menu__close" (click)="closeMobileMenu()">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <nav class="mobile-menu__nav">
          <!-- Dans le template, remplace les svg avec path dynamique par ceci : -->
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              class="sidebar__item"
              [routerLinkActiveOptions]="{ exact: false }"
            >
              <svg
                class="sidebar__item-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path [attr.d]="item.icon" />
              </svg>
              <span>{{ item.label }}</span>
            </a>
          }
        </nav>

        <div class="mobile-menu__footer">
          <div class="mobile-menu__user">
            <div class="mobile-menu__user-avatar">👨‍💼</div>
            <div class="mobile-menu__user-name">Administrateur</div>
          </div>
        </div>
      </div>
    </div>
  }

  <!-- Main Content -->
  <main class="main-content">
    <div class="main-content__inner">
      <router-outlet />
    </div>
  </main>
  <app-confirm-modal />

  <app-toast />
</div>
